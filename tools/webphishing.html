<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Web Phishing Check - ToolsAriel</title>
<link rel="stylesheet" href="_shared.css">
</head>
<body>
<video class="bg-video" autoplay muted loop playsinline><source src="../media/background.mp4" type="video/mp4" /></video>
<div class="bg-overlay"></div>
<div class="app">
<nav class="navbar">
<div class="nav-logo">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<rect x="6" y="6" width="88" height="88" fill="#dc2626" stroke="#000" stroke-width="6"/>
<rect x="16" y="16" width="68" height="68" fill="#ffffff" stroke="#000" stroke-width="4"/>
<rect x="24" y="26" width="22" height="6" fill="#000"/>
<rect x="32" y="26" width="6" height="34" fill="#000"/>
<path d="M54 60 L64 26 L74 60 L68 60 L66 52 L62 52 L60 60 Z M63 46 L65 46 L64 40 Z" fill="#dc2626" stroke="#000" stroke-width="1.5"/>
</svg>

Kembali
</a>

<div class="container">
<div class="page-title"><div class="line"></div><div class="text">Web Phishing Check</div><div class="line"></div></div>
<div class="panel">
<div class="field">
<label>URL Website</label>
<input type="text" id="urlInput" placeholder="https://contoh-website.com" />
<div class="field-info">Cek apakah situs berpotensi phishing / berbahaya</div>
</div>
<div class="actions">
<button class="btn" id="btnCheck" onclick="checkUrl()">Check URL</button>
<button class="btn btn-outline" onclick="resetForm()">Reset</button>
</div>
</div>
<div class="loading" id="loading">Memeriksa</div>
<div class="result" id="result"><div class="result-card" id="resultCard"></div></div>
</div>
</div>
<div class="toast" id="toast">-</div>
<script>
var toastTimer=null;
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},3000)}
function setLoading(on){document.getElementById('loading').classList.toggle('show',on);document.getElementById('btnCheck').disabled=on}
function escapeHtml(s){if(s==null)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function resetForm(){document.getElementById('urlInput').value='';document.getElementById('result').classList.remove('show')}

async function checkUrl(){
  var url=document.getElementById('urlInput').value.trim();
  if(!url){showToast('Masukkan URL dulu!');return}
  if(!/^https?:\/\//i.test(url))url='https://'+url;
  setLoading(true);document.getElementById('result').classList.remove('show');
  try{
    var r=await fetch('/api/tools?action=webphishing&url='+encodeURIComponent(url));
    var data=await r.json();
    if(data.status===false||data.success===false)throw new Error(data.message||'Gagal memeriksa URL');
    var info=data.result||{};
    var flags=[
      {label:'Halaman Phishing',value:info.is_phishing},
      {label:'Mengarah ke Situs Berbahaya',value:info.sends_to_harmful_sites},
      {label:'Menginstall Software Berbahaya',value:info.installs_malicious_software},
      {label:'Mengandung Malware',value:info.contains_malware},
      {label:'Unduhan Tidak Wajar',value:info.uncommon_downloads}
    ].filter(function(f){return typeof f.value==='boolean'});
    var anyTrue=flags.some(function(f){return f.value===true});
    var color=anyTrue?'#dc2626':'#16a34a';
    var label=info.status_description||(anyTrue?'Berisiko':'Aman');
    var html='<div style="position:relative;z-index:2;">';
    html+='<div style="font-size:16px;font-weight:900;color:'+color+';text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;">'+escapeHtml(label)+'</div>';
    html+='<div style="font-size:11px;color:#666;font-weight:700;word-break:break-all;margin-bottom:14px;">'+escapeHtml(info.scanned_url||url)+'</div>';
    flags.forEach(function(f){
      html+='<div style="display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:800;margin-bottom:6px;color:'+(f.value?'#dc2626':'#16a34a')+';">';
      html+='<span>'+(f.value?'✕':'✓')+'</span><span>'+escapeHtml(f.label)+'</span>';
      html+='</div>';
    });
    html+='</div>';
    document.getElementById('resultCard').innerHTML=html;
    setLoading(false);document.getElementById('result').classList.add('show');showToast('Selesai!');
  }catch(err){setLoading(false);showToast('Error: '+err.message);
    document.getElementById('resultCard').innerHTML='<div class="error-box">'+escapeHtml(err.message)+'</div>';
    document.getElementById('result').classList.add('show')}
}
document.getElementById('urlInput').addEventListener('keydown',function(e){if(e.key==='Enter')checkUrl()});
</script>
</body>
</html>
