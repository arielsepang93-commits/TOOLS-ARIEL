<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spotify Search - ToolsAriel</title>
<link rel="stylesheet" href="_shared.css">
</head>
<body>
<video class="bg-video" autoplay muted loop playsinline><source src="../media/background.mp4" type="video/mp4" /></video>
<div class="bg-overlay"></div>
<div class="app">
<nav class="navbar">
<div class="nav-logo">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<rect x="6" y="6" width="88" height="88" fill="#dc2626" stroke="#000" stroke-width="6"/>
<rect x="16" y="16" width="68" height="68" fill="#ffffff" stroke="#000" stroke-width="4"/>
<rect x="24" y="26" width="22" height="6" fill="#000"/>
<rect x="32" y="26" width="6" height="34" fill="#000"/>
<path d="M54 60 L64 26 L74 60 L68 60 L66 52 L62 52 L60 60 Z M63 46 L65 46 L64 40 Z" fill="#dc2626" stroke="#000" stroke-width="1.5"/>
</svg>
<div class="brand-text">TOOLS <span>ARIEL</span></div>
</div>
<a class="back-btn" href="../dashboard.html">
<svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2z"/></svg>
Kembali
</a>
</nav>
<div class="container">
<div class="page-title"><div class="line"></div><div class="text">Spotify Search</div><div class="line"></div></div>
<div class="panel">
<div class="field">
<label>Cari Lagu / Artis</label>
<input type="text" id="qInput" placeholder="Contoh: Ariana Grande" />
<div class="field-info">Cari lagu, klik link Spotify untuk buka</div>
</div>
<div class="actions">
<button class="btn" id="btnSearch" onclick="cariLagu()">Cari</button>
<button class="btn btn-outline" onclick="resetForm()">Reset</button>
</div>
</div>
<div class="loading" id="loading">Mencari</div>
<div class="result" id="result"><div class="result-card" id="resultCard"></div></div>
</div>
</div>
<div class="toast" id="toast">-</div>
<script>
var toastTimer=null;
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},3000)}
function setLoading(on){document.getElementById('loading').classList.toggle('show',on);document.getElementById('btnSearch').disabled=on}
function escapeHtml(s){if(s==null)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function resetForm(){document.getElementById('qInput').value='';document.getElementById('result').classList.remove('show')}

async function cariLagu(){
  var q=document.getElementById('qInput').value.trim();
  if(!q){showToast('Masukkan judul lagu/artis!');return}
  setLoading(true);document.getElementById('result').classList.remove('show');
  try{
    var r=await fetch('/api/tools?action=spotifysearch&q='+encodeURIComponent(q));
    var data=await r.json();
    if(data.status===false||data.success===false){
      document.getElementById('resultCard').innerHTML='<div class="error-box">'+escapeHtml(data.message||'Gagal mencari')+'</div>';
      document.getElementById('result').classList.add('show');setLoading(false);showToast('Gagal: '+(data.message||'Unknown'));return;
    }
    var list=Array.isArray(data.result)?data.result:[];
    if(!list.length){
      document.getElementById('resultCard').innerHTML='<div class="error-box">Lagu tidak ditemukan</div>';
      document.getElementById('result').classList.add('show');setLoading(false);return;
    }
    var html='';
    list.slice(0,15).forEach(function(t){
      var title=t.title||'Tanpa Judul';
      var artist=t.artist||'-';
      var image=t.thumbnail||'';
      var duration=t.duration||'';
      var trackUrl=t.url||'';
      html+='<div class="file-row">';
      html+=image
        ?'<img class="file-thumb" src="'+escapeHtml(image)+'" alt="">'
        :'<div class="file-icon">MUS</div>';
      html+='<div class="file-info"><div class="file-name">'+escapeHtml(title)+'</div>'+
        '<div class="file-meta">'+escapeHtml(artist)+(duration?' • '+escapeHtml(duration):'')+'</div></div>';
      if(trackUrl){
        html+='<a class="btn" style="padding:9px 12px;font-size:10px;flex-shrink:0;" href="'+escapeHtml(trackUrl)+'" target="_blank" rel="noopener">Buka</a>';
      }
      html+='</div>';
    });
    document.getElementById('resultCard').innerHTML=html;
    setLoading(false);document.getElementById('result').classList.add('show');showToast(list.length+' lagu ditemukan!');
  }catch(err){setLoading(false);showToast('Error: '+err.message);
    document.getElementById('resultCard').innerHTML='<div class="error-box">'+escapeHtml(err.message)+'</div>';
    document.getElementById('result').classList.add('show')}
}
document.getElementById('qInput').addEventListener('keydown',function(e){if(e.key==='Enter')cariLagu()});
</script>
</body>
</html>
