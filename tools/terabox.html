<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Terabox Downloader - ToolsAriel</title>
<link rel="stylesheet" href="_shared.css">
</head>
<body>
<video class="bg-video" autoplay muted loop playsinline><source src="../media/background.mp4" type="video/mp4" /></video>
<div class="bg-overlay"></div>
<div class="app">
<nav class="navbar">
<div class="nav-logo">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<rect x="6" y="6" width="88" height="88" fill="#dc2626" stroke="#000" stroke-width="6"/>
<rect x="16" y="16" width="68" height="68" fill="#ffffff" stroke="#000" stroke-width="4"/>
<rect x="24" y="26" width="22" height="6" fill="#000"/>
<rect x="32" y="26" width="6" height="34" fill="#000"/>
<path d="M54 60 L64 26 L74 60 L68 60 L66 52 L62 52 L60 60 Z M63 46 L65 46 L64 40 Z" fill="#dc2626" stroke="#000" stroke-width="1.5"/>
</svg>
<div class="brand-text">TOOLS <span>ARIEL</span></div>
</div>
<a class="back-btn" href="../dashboard.html">
<svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2z"/></svg>
Kembali
</a>
</nav>
<div class="container">
<div class="page-title"><div class="line"></div><div class="text">Terabox Downloader</div><div class="line"></div></div>
<div class="panel">
<div class="field">
<label>Link Terabox</label>
<input type="text" id="urlInput" placeholder="https://terabox.com/s/..." />
<div class="field-info">Tempel link share Terabox di sini</div>
</div>
<div class="actions">
<button class="btn" id="btnFetch" onclick="ambilFile()">Ambil File</button>
<button class="btn btn-outline" onclick="resetForm()">Reset</button>
</div>
</div>
<div class="loading" id="loading">Memproses</div>
<div class="result" id="result"><div class="result-card" id="resultCard"></div></div>
</div>
</div>
<div class="toast" id="toast">-</div>
<script>
var toastTimer=null;
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},3000)}
function setLoading(on){document.getElementById('loading').classList.toggle('show',on);document.getElementById('btnFetch').disabled=on}
function escapeHtml(s){if(s==null)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function resetForm(){document.getElementById('urlInput').value='';document.getElementById('result').classList.remove('show')}

function pickArray(v){return Array.isArray(v)?v:null}
function linkFields(o){return o&&(o.download_url||o.downloadUrl||o.url||o.link||o.dlink||o.fast_download||o.direct_link||o.directLink||o.stream_url||o.streamUrl||o.playUrl||o.play_url||o.download)}
function normalizeFiles(data){
  var rawList=pickArray(data.result&&data.result.file)||pickArray(data.result&&data.result.files)||
    pickArray(data.data&&data.data.file)||pickArray(data.data&&data.data.files)||
    pickArray(data.file)||pickArray(data.files)||
    pickArray(data.result&&data.result.list)||pickArray(data.data&&data.data.list)||
    pickArray(data.list)||pickArray(data.result)||pickArray(data.data);
  if(!rawList){var single=data.result||data.data||data;if(linkFields(single))rawList=[single]}
  if(!rawList)return[];
  return rawList.map(function(f){
    return{
      name:f.filename||f.name||f.title||f.file_name||'File Terabox',
      size:f.size_formatted||f.sizeFormatted||f.size||f.file_size||f.fileSize||'',
      downloadUrl:linkFields(f)||'',
      thumb:f.thumbnail||f.thumb||f.image||f.cover||'',
      duration:f.duration||'',
      quality:f.quality||''
    }
  }).filter(function(f){return f.downloadUrl})}

async function ambilFile(){
  var url=document.getElementById('urlInput').value.trim();
  if(!url){showToast('Masukkan URL Terabox dulu!');return}
  setLoading(true);document.getElementById('result').classList.remove('show');
  try{
    var r=await fetch('/api/tools?action=terabox&url='+encodeURIComponent(url));
    var data=await r.json();
    var files=normalizeFiles(data);
    if(!files.length){
      document.getElementById('resultCard').innerHTML='<div class="error-box">'+escapeHtml(data.message||'File tidak ditemukan')+'</div>';
      document.getElementById('result').classList.add('show');setLoading(false);return;
    }
    var html='<div class="track-title" style="margin-bottom:12px;">'+files.length+' File Ditemukan</div>';
    files.forEach(function(f){
      html+='<div class="file-row">';
      html+=f.thumb
        ?'<img class="file-thumb" src="'+escapeHtml(f.thumb)+'" alt="">'
        :'<div class="file-icon">FILE</div>';
      html+='<div class="file-info"><div class="file-name">'+escapeHtml(f.name)+'</div>'+
        '<div class="file-meta">'+escapeHtml(f.size)+(f.quality?' • '+escapeHtml(f.quality):'')+(f.duration?' • '+escapeHtml(f.duration):'')+'</div></div>';
      html+='<a class="btn" style="padding:9px 12px;font-size:10px;flex-shrink:0;" href="'+escapeHtml(f.downloadUrl)+'" target="_blank" rel="noopener">Unduh</a>';
      html+='</div>';
    });
    document.getElementById('resultCard').innerHTML=html;
    setLoading(false);document.getElementById('result').classList.add('show');showToast(files.length+' file siap diunduh!');
  }catch(err){setLoading(false);showToast('Error: '+err.message);
    document.getElementById('resultCard').innerHTML='<div class="error-box">'+escapeHtml(err.message)+'</div>';
    document.getElementById('result').classList.add('show')}
}
document.getElementById('urlInput').addEventListener('keydown',function(e){if(e.key==='Enter')ambilFile()});
</script>
</body>
</html>
