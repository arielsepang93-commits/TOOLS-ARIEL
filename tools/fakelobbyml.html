<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fake Lobby ML - ToolsAriel</title>
<link rel="stylesheet" href="_shared.css">
</head>
<body>
<video class="bg-video" autoplay muted loop playsinline><source src="../media/background.mp4" type="video/mp4" /></video>
<div class="bg-overlay"></div>
<div class="app">
<nav class="navbar">
<div class="nav-logo">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<rect x="6" y="6" width="88" height="88" fill="#dc2626" stroke="#000" stroke-width="6"/>
<rect x="16" y="16" width="68" height="68" fill="#ffffff" stroke="#000" stroke-width="4"/>
<rect x="24" y="26" width="22" height="6" fill="#000"/>
<rect x="32" y="26" width="6" height="34" fill="#000"/>
<path d="M54 60 L64 26 L74 60 L68 60 L66 52 L62 52 L60 60 Z M63 46 L65 46 L64 40 Z" fill="#dc2626" stroke="#000" stroke-width="1.5"/>
</svg>
<div class="brand-text">TOOLS <span>ARIEL</span></div>
</div>
<a class="back-btn" href="../dashboard.html">
<svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2z"/></svg>
Kembali
</a>
</nav>
<div class="container">
<div class="page-title"><div class="line"></div><div class="text">Fake Lobby ML</div><div class="line"></div></div>
<div class="panel">
<div class="field">
<label>Nickname</label>
<input type="text" id="nickname" placeholder="Contoh: Ariel" />
</div>
<div class="field">
<label>Foto Profil</label>
<input type="file" id="avatarFile" accept="image/*" style="padding:10px;" />
<div class="field-info">Foto akan otomatis diupload ke Catbox</div>
</div>
<div class="actions">
<button class="btn" id="btnGen" onclick="generate()">Buat Gambar</button>
<button class="btn btn-outline" onclick="resetForm()">Reset</button>
</div>
</div>
<div class="loading" id="loading">Memproses</div>
<div class="result" id="result"><div class="result-card" id="resultCard"></div></div>
</div>
</div>
<div class="toast" id="toast">-</div>
<script>
var toastTimer=null;
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},3000)}
function setLoading(on){document.getElementById('loading').classList.toggle('show',on);document.getElementById('btnGen').disabled=on}
function resetForm(){document.getElementById('nickname').value='';document.getElementById('avatarFile').value='';document.getElementById('result').classList.remove('show')}

async function uploadToCatbox(file){
  var base64=await new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(){resolve(reader.result.split(',')[1])};
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });

  var res=await fetch('/api/tools?action=catboxupload',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      filename:file.name||'file.png',
      contentType:file.type||'image/png',
      data:base64
    })
  });

  var result=await res.json();
  if(!result.success||!result.url)throw new Error(result.message||'Upload gagal');
  return result.url;
}

// Helper: baca error dari respons yang bukan gambar
async function bacaErrorResponse(r){
  var ct=r.headers.get('content-type')||'';
  if(ct.includes('application/json')){
    try{
      var j=await r.json();
      return j.message||j.error||JSON.stringify(j).substring(0,200);
    }catch(e){}
  }
  var txt=await r.text();
  // Coba extract dari JSON Cloudflare
  try{
    var j2=JSON.parse(txt);
    if(j2.detail)return j2.detail;
    if(j2.title)return j2.title;
    if(j2.message)return j2.message;
  }catch(e){}
  return txt.substring(0,200)||('HTTP '+r.status);
}

async function generate(){
  var nickname=document.getElementById('nickname').value.trim();
  var file=document.getElementById('avatarFile').files[0];
  if(!nickname){showToast('Masukkan nickname!');return}
  if(!file){showToast('Pilih foto profil!');return}
  setLoading(true);document.getElementById('result').classList.remove('show');

  try{
    // 1. Upload ke Catbox
    var catboxUrl=await uploadToCatbox(file);

    // 2. Minta NexRay generate gambar
    var r=await fetch('/api/tools?action=fakelobbyml&nickname='+encodeURIComponent(nickname)+'&avatar='+encodeURIComponent(catboxUrl));

    // 3. Cek apakah respons benar-benar gambar
    var ct=r.headers.get('content-type')||'';
    if(!ct.startsWith('image/')){
      var errMsg=await bacaErrorResponse(r);
      if(r.status===502||r.status===503||r.status===504){
        throw new Error('Server gambar lagi sibuk/down. Coba lagi beberapa menit.');
      }
      throw new Error(errMsg);
    }

    // 4. Render gambar
    var blob=await r.blob();
    var url=URL.createObjectURL(blob);
    document.getElementById('resultCard').innerHTML=
      '<img class="center-img" src="'+url+'" alt="Fake Lobby ML">'+
      '<a class="download-btn" href="'+url+'" download="fakelobbyml_'+Date.now()+'.png">Download Gambar</a>';
    setLoading(false);document.getElementById('result').classList.add('show');showToast('Berhasil!');

  }catch(err){
    setLoading(false);showToast('Error: '+err.message);
    document.getElementById('resultCard').innerHTML=
      '<div class="error-box" style="text-align:center;">'+
        '<div style="margin-bottom:10px;">'+err.message+'</div>'+
        '<button class="btn" style="width:auto;padding:10px 18px;font-size:11px;" onclick="generate()">Coba Lagi</button>'+
      '</div>';
    document.getElementById('result').classList.add('show');
  }
}
</script>
</body>
</html>
