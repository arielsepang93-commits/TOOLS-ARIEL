<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FF Stalker - ToolsAriel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',sans-serif}
html,body{min-height:100vh;background:#000;color:#000;overflow-x:hidden}
.bg-video{position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;z-index:0;pointer-events:none;filter:blur(8px) saturate(140%);transform:scale(1.08)}
.bg-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.5);z-index:1;pointer-events:none}
.app{position:relative;z-index:10;min-height:100vh;padding:24px}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:rgba(255,255,255,.9);border:3px solid #000;box-shadow:5px 5px 0 #dc2626;margin-bottom:24px}
.nav-logo{display:flex;align-items:center;gap:10px}
.nav-logo svg{width:36px;height:36px;filter:drop-shadow(2px 2px 0 #000)}
.nav-logo .brand-text{font-size:14px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:#000}
.nav-logo .brand-text span{color:#dc2626;text-shadow:1.5px 1.5px 0 #000}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;background:#fff;border:3px solid #000;font-size:11px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;box-shadow:3px 3px 0 #000;transition:.15s;color:#000;text-decoration:none}
.back-btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 #000;background:#fef2f2}
.back-btn svg{width:14px;height:14px;fill:#000}
.container{max-width:800px;margin:0 auto}
.page-title{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.page-title .line{flex:1;height:4px;background:#dc2626;border-top:2px solid #000;border-bottom:2px solid #000}
.page-title .text{font-size:13px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:#fff;text-shadow:2px 2px 0 #000;background:#dc2626;padding:7px 16px;border:3px solid #000;box-shadow:4px 4px 0 #000;white-space:nowrap}
.panel{background:rgba(255,255,255,.6);border:4px solid #dc2626;padding:22px;box-shadow:8px 8px 0 #dc2626,16px 16px 0 #000;position:relative;margin-bottom:22px}
.panel::before{content:'';position:absolute;inset:8px;border:2px solid #dc2626;pointer-events:none;opacity:.4}
.field{margin-bottom:14px;position:relative;z-index:2}
.field label{display:block;font-size:10.5px;font-weight:900;color:#000;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.field input{width:100%;padding:14px 16px;border:3px solid #000;font-size:13.5px;font-weight:600;color:#000;outline:none;background:#fff;transition:.2s;font-family:inherit}
.field input::placeholder{color:#999}
.field input:focus{border-color:#dc2626;background:#fef2f2;box-shadow:4px 4px 0 #000;transform:translate(-2px,-2px)}
.field-info{font-size:10.5px;color:#666;margin-top:6px;font-weight:600;position:relative;z-index:2}
.actions{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:2}
.btn{padding:12px 20px;border:3px solid #000;background:#dc2626;color:#fff;font-size:12px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;box-shadow:4px 4px 0 #000;transition:.15s;font-family:inherit;display:inline-block;text-align:center}
.btn:hover{background:#b91c1c;transform:translate(-2px,-2px);box-shadow:6px 6px 0 #000}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-outline{background:#fff;color:#000}
.btn-outline:hover{background:#fef2f2}
.loading{display:none;text-align:center;padding:30px;color:#fff;font-weight:900;letter-spacing:2px;text-transform:uppercase;font-size:13px}
.loading.show{display:block}
.loading::after{content:'';display:inline-block;width:20px;height:20px;margin-left:12px;border:3px solid #dc2626;border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.result{display:none}
.result.show{display:block;animation:pageIn .4s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.result-card{background:rgba(255,255,255,.95);border:4px solid #dc2626;padding:20px;box-shadow:8px 8px 0 #dc2626,16px 16px 0 #000;position:relative}
.result-card::before{content:'';position:absolute;inset:8px;border:2px solid #dc2626;pointer-events:none;opacity:.4}
.profile-header{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px;position:relative;z-index:2}
.profile-avatar{width:100px;height:100px;border:3px solid #000;background:#dc2626;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#fff;flex-shrink:0;overflow:hidden}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{flex:1;min-width:0}
.profile-nick{font-size:20px;font-weight:900;color:#000;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;word-break:break-word;line-height:1.2}
.profile-uid{font-size:12px;font-weight:800;color:#dc2626;letter-spacing:1.5px;text-transform:uppercase}
.info-table{width:100%;border-collapse:collapse;font-size:13px;position:relative;z-index:2}
.info-table td{padding:8px 4px;border-bottom:2px solid #000}
.info-table td:first-child{font-weight:900;width:45%}
.info-table td:last-child{font-weight:600;word-break:break-word}
.error-box{background:#fef2f2;border:3px solid #dc2626;color:#dc2626;padding:14px;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;text-align:center;position:relative;z-index:2}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);background:#000;color:#fff;padding:12px 20px;border:3px solid #dc2626;box-shadow:5px 5px 0 #dc2626;font-size:11.5px;font-weight:900;letter-spacing:1px;text-transform:uppercase;z-index:9999;transition:transform .4s cubic-bezier(.3,1.3,.5,1);max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
@media (max-width:600px){.nav-logo .brand-text{font-size:12px;letter-spacing:2px}.panel,.result-card{padding:16px;box-shadow:6px 6px 0 #dc2626,12px 12px 0 #000}.page-title .text{font-size:11px;letter-spacing:2px;padding:6px 12px}.btn{padding:11px 14px;font-size:11px}.profile-avatar{width:80px;height:80px;font-size:32px}.profile-nick{font-size:17px}}
</style>
</head>
<body>
<video class="bg-video" autoplay muted loop playsinline><source src="../media/background.mp4" type="video/mp4" /></video>
<div class="bg-overlay"></div>
<div class="app">
<nav class="navbar">
<div class="nav-logo">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<rect x="6" y="6" width="88" height="88" fill="#dc2626" stroke="#000" stroke-width="6"/>
<rect x="16" y="16" width="68" height="68" fill="#ffffff" stroke="#000" stroke-width="4"/>
<rect x="24" y="26" width="22" height="6" fill="#000"/>
<rect x="32" y="26" width="6" height="34" fill="#000"/>
<path d="M54 60 L64 26 L74 60 L68 60 L66 52 L62 52 L60 60 Z M63 46 L65 46 L64 40 Z" fill="#dc2626" stroke="#000" stroke-width="1.5"/>
</svg>
<div class="brand-text">TOOLS <span>ARIEL</span></div>
</div>
<a class="back-btn" href="../dashboard.html">
<svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2z"/></svg>
Kembali
</a>
</nav>
<div class="container">
<div class="page-title"><div class="line"></div><div class="text">FF Stalker</div><div class="line"></div></div>
<div class="panel">
<div class="field">
<label>UID Free Fire</label>
<input type="text" id="uidInput" placeholder="Masukkan UID Free Fire" />
<div class="field-info">Contoh: 123456789</div>
</div>
<div class="actions">
<button class="btn" id="btnCek" onclick="stalkFF()">Cek Akun</button>
<button class="btn btn-outline" onclick="resetForm()">Reset</button>
</div>
</div>
<div class="loading" id="loading">Memproses</div>
<div class="result" id="result"><div class="result-card" id="resultCard"></div></div>
</div>
</div>
<div class="toast" id="toast">-</div>
<script>
var toastTimer=null;
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},3000)}
function setLoading(on){document.getElementById('loading').classList.toggle('show',on);document.getElementById('btnCek').disabled=on}
function escapeHtml(str){if(str===null||str===undefined)return '';return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function resetForm(){document.getElementById('uidInput').value='';document.getElementById('result').classList.remove('show')}

async function stalkFF(){
var uid=document.getElementById('uidInput').value.trim();
if(!uid){showToast('Masukkan UID Free Fire dulu!');return}
setLoading(true);document.getElementById('result').classList.remove('show');
try{
// ===== [ENDPOINT-UPDATE] =====
var res=await fetch('/api/tools?action=ffstalk&userId='+encodeURIComponent(uid));
var text=await res.text();var data;
try{data=JSON.parse(text)}catch(e){
showToast('Response tidak valid');
document.getElementById('resultCard').innerHTML='<div class="error-box">Response server tidak valid</div>';
document.getElementById('result').classList.add('show');setLoading(false);return}
if(!data.status||!data.result){
showToast('Gagal: '+(data.message||'Data tidak ditemukan'));
document.getElementById('resultCard').innerHTML='<div class="error-box">'+escapeHtml(data.message||'Akun tidak ditemukan atau API down')+'</div>';
document.getElementById('result').classList.add('show');setLoading(false);return}
renderResult(data.result);
setLoading(false);document.getElementById('result').classList.add('show');showToast('Berhasil!');
}catch(err){setLoading(false);showToast('Error: '+err.message);document.getElementById('resultCard').innerHTML='<div class="error-box">'+escapeHtml(err.message)+'</div>';document.getElementById('result').classList.add('show')}}

function renderResult(r){
var nick=r.nickname||r.name||r.username||'Unknown';
var uid=r.uid||r.account_id||'-';
var level=r.level||r.account_level||'-';
var rank=r.rank||r.rank_name||'-';
var guild=r.guild||r.guild_name||r.clan||'-';
var signature=r.signature||r.bio||'-';
var region=r.region||r.server||'-';
var created=r.created_at||r.created||'-';
var avatar=r.avatar||r.icon||r.profile_pic||'';
var initial=nick.charAt(0).toUpperCase();
var avatarHtml=avatar
?'<div class="profile-avatar"><img src="'+escapeHtml(avatar)+'" onerror="this.parentNode.textContent=\''+escapeHtml(initial)+'\'"></div>'
:'<div class="profile-avatar">'+escapeHtml(initial)+'</div>';
var html='<div class="profile-header">'+avatarHtml+'<div class="profile-info"><div class="profile-nick">'+escapeHtml(nick)+'</div><div class="profile-uid">UID: '+escapeHtml(uid)+'</div></div></div>'+
'<table class="info-table">'+
'<tr><td>Level</td><td>'+escapeHtml(level)+'</td></tr>'+
'<tr><td>Rank</td><td>'+escapeHtml(rank)+'</td></tr>'+
'<tr><td>Guild</td><td>'+escapeHtml(guild)+'</td></tr>'+
'<tr><td>Region</td><td>'+escapeHtml(region)+'</td></tr>'+
'<tr><td>Signature</td><td>'+escapeHtml(signature)+'</td></tr>'+
'<tr><td>Dibuat</td><td>'+escapeHtml(created)+'</td></tr>'+
'</table>';
document.getElementById('resultCard').innerHTML=html;
}

document.getElementById('uidInput').addEventListener('keydown',function(e){if(e.key==='Enter')stalkFF()});
</script>
</body>
</html>
